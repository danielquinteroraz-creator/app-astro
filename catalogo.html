<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ASTRO, colección de prendas y accesorios de líneas depuradas.">
  <title>Catálogo | ASTRO</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/products.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body data-page="catalogo">
  <a class="skip" href="#principal">Saltar al contenido</a>
  <header class="header" id="cabecera"></header>
  <main id="principal" tabindex="-1">
<section class="intro wrap"><p class="label">El guardarropa ASTRO</p><h1>Catálogo</h1><p>Explora la colección por categoría, talla y precio.</p></section>
    <section class="wrap section compact-top" aria-label="Productos del catálogo">
      <form id="filtros" class="filters">
        <label>Categoría<select name="categoria" id="filtro-categoria"><option value="">Todas</option></select></label>
        <label>Talla<select name="talla" id="filtro-talla"><option value="">Todas</option></select></label>
        <label>Precio<select name="precio"><option value="">Todos</option><option value="35-99">Hasta 99 €</option><option value="100-149">100–149 €</option><option value="150-199">150–199 €</option><option value="200-320">Desde 200 €</option></select></label>
        <label>Ordenar<select name="orden"><option value="recientes">Más recientes</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option></select></label>
        <button class="button outline" type="reset">Limpiar filtros</button>
      </form>
      <p id="resultados" class="label results" role="status"></p>
      <div class="product-grid" id="productos"></div>
    </section>
  </main>
  <footer class="footer" id="pie"></footer>
</body>
</html>
